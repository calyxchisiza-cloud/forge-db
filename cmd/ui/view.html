<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ForgeDB</title>
  <style>
    :root {
      --ink: #14211c;
      --muted: #2c463c;
      --ground: #dfe8e3;
      --paper: #f6faf7;
      --line: #9eb0a6;
      --accent: #0c6b52;
      --accent-ink: #f4fbf7;
      --warn: #6e2e24;
      --warn-ground: #f3e4df;
      --focus: #0c6b52;
      color-scheme: light;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      min-height: 100%;
      background: var(--ground);
      color: var(--ink);
      font: 16px/1.45 "Segoe UI", "Helvetica Neue", sans-serif;
      caret-color: var(--accent);
    }
    ::selection { background: #b7ddd0; color: var(--ink); }
    :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
    button, input { font: inherit; color: inherit; }
    header {
      display: flex;
      justify-content: space-between;
      gap: 1.5rem;
      align-items: end;
      padding: 1.25rem 1.5rem 0.75rem;
    }
    h1 {
      margin: 0;
      font-size: 1.75rem;
      font-weight: 650;
      letter-spacing: -0.03em;
      line-height: 1.1;
    }
    #filemeta {
      margin: 0.35rem 0 0;
      max-width: 70ch;
      color: var(--muted);
    }
    .layout {
      display: grid;
      grid-template-columns: 16rem minmax(0, 1fr);
      gap: 1rem;
      padding: 0.5rem 1.5rem 1.5rem;
      min-height: calc(100vh - 6.5rem);
    }
    nav, main {
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 2px;
    }
    nav { padding: 0.75rem; }
    nav h2, main h2 {
      margin: 0 0 0.75rem;
      font-size: 0.95rem;
      font-weight: 650;
    }
    #tables { display: flex; flex-direction: column; gap: 0.35rem; }
    .table-button, .page-button, #run {
      border: 1px solid var(--line);
      background: transparent;
      border-radius: 2px;
      cursor: pointer;
    }
    .table-button {
      text-align: left;
      padding: 0.55rem 0.65rem;
    }
    .table-button strong { display: block; }
    .table-button span { color: var(--muted); font-size: 0.85rem; }
    .table-button[aria-current="true"] {
      background: var(--accent);
      border-color: var(--accent);
      color: var(--accent-ink);
    }
    .table-button[aria-current="true"] span { color: var(--accent-ink); }
    .table-button:hover, .page-button:hover, #run:hover { border-color: var(--accent); }
    main { padding: 0.9rem 1rem 1rem; min-width: 0; }
    #pages {
      display: flex;
      flex-wrap: wrap;
      gap: 0.35rem;
      margin-bottom: 1rem;
    }
    .page-button {
      min-width: 4.5rem;
      padding: 0.35rem 0.45rem;
      text-align: left;
      font-variant-numeric: tabular-nums;
    }
    .page-button small { display: block; color: var(--muted); font-size: 0.75rem; }
    .page-button.mark {
      background: #d5ebe3;
      border-color: var(--accent);
    }
    .scroll { overflow: auto; max-height: 22rem; }
    table { border-collapse: collapse; width: max-content; max-width: 100%; }
    th, td {
      padding: 0.4rem 0.7rem;
      border-bottom: 1px solid var(--line);
      text-align: left;
      vertical-align: top;
      white-space: nowrap;
    }
    th { font-weight: 650; position: sticky; top: 0; background: var(--paper); }
    td.num { font-variant-numeric: tabular-nums; }
    td.nil { color: var(--muted); }
    #note, #status { margin: 0.75rem 0 0; color: var(--muted); }
    #status.error { color: var(--warn); background: var(--warn-ground); padding: 0.45rem 0.6rem; }
    form {
      display: flex;
      gap: 0.5rem;
      align-items: center;
      margin-top: 1rem;
    }
    label { color: var(--muted); }
    input {
      flex: 1;
      min-width: 0;
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 2px;
      padding: 0.5rem 0.6rem;
    }
    #run {
      background: var(--accent);
      color: var(--accent-ink);
      border-color: var(--accent);
      padding: 0.5rem 0.9rem;
    }
    #run:disabled { opacity: 0.55; cursor: wait; }
    #grid.reveal { animation: open 180ms cubic-bezier(0.16, 1, 0.3, 1); }
    @keyframes open {
      from { clip-path: inset(0 0 100% 0); }
      to { clip-path: inset(0 0 0 0); }
    }
    @media (prefers-reduced-motion: reduce) {
      #grid.reveal { animation: none; }
    }
    ::-webkit-scrollbar { width: 10px; height: 10px; }
    ::-webkit-scrollbar-thumb { background: var(--line); }
    @media (max-width: 700px) {
      header { flex-direction: column; align-items: start; }
      .layout { grid-template-columns: 1fr; }
      #tables { flex-direction: row; overflow-x: auto; }
      .table-button { min-width: 9rem; }
      form { flex-wrap: wrap; }
      input { flex-basis: 100%; }
    }
  </style>
</head>
<body>
  <header>
    <div>
      <h1 id="filename">ForgeDB</h1>
      <p id="filemeta">Reading the file…</p>
    </div>
  </header>
  <div class="layout">
    <nav>
      <h2>Tables</h2>
      <div id="tables"></div>
    </nav>
    <main>
      <div id="pages"></div>
      <h2 id="title">Rows</h2>
      <div class="scroll">
        <table id="grid"></table>
      </div>
      <p id="note"></p>
      <form id="stmt">
        <label for="sql">Statement</label>
        <input id="sql" name="sql" autocomplete="off" spellcheck="false" placeholder="SELECT * FROM account">
        <button id="run" type="submit">Run</button>
      </form>
      <p id="status" role="status"></p>
    </main>
  </div>
  <script>
    const filename = document.querySelector("#filename");
    const filemeta = document.querySelector("#filemeta");
    const tablesEl = document.querySelector("#tables");
    const pagesEl = document.querySelector("#pages");
    const title = document.querySelector("#title");
    const grid = document.querySelector("#grid");
    const note = document.querySelector("#note");
    const status = document.querySelector("#status");
    const form = document.querySelector("#stmt");
    const sql = document.querySelector("#sql");
    const run = document.querySelector("#run");
    let snap = null;
    let selected = "";
    let statementRows = false;

    function setStatus(text, isError) {
      status.textContent = text || "";
      status.classList.toggle("error", Boolean(isError));
    }

    function rowCount(n) {
      return n === 1 ? "1 row" : n + " rows";
    }

    function cellText(value) {
      if (value === null || value === undefined) return "NULL";
      return String(value);
    }

    function showRows(columns, rows, heading, extra) {
      title.textContent = heading;
      note.textContent = extra || "";
      const head = columns.map((name) => "<th>" + escapeHTML(name) + "</th>").join("");
      const body = rows.map((row) => {
        const cells = row.map((value) => {
          const nil = value === null || value === undefined;
          const num = typeof value === "number";
          const cls = nil ? "nil" : (num ? "num" : "");
          return "<td class=\"" + cls + "\">" + escapeHTML(cellText(value)) + "</td>";
        }).join("");
        return "<tr>" + cells + "</tr>";
      }).join("");
      grid.innerHTML = "<thead><tr>" + head + "</tr></thead><tbody>" + body + "</tbody>";
      grid.classList.remove("reveal");
      void grid.offsetWidth;
      grid.classList.add("reveal");
    }

    function escapeHTML(text) {
      return String(text).replace(/[&<>"]/g, (ch) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;"
      }[ch]));
    }

    function renderSnap() {
      const base = snap.path.split(/[\\/]/).pop();
      filename.textContent = base || "ForgeDB";
      document.title = base || "ForgeDB";
      const free = snap.freeHead === 0 ? "no free pages" : "free list starts at page " + snap.freeHead;
      filemeta.textContent = snap.path + " · " + snap.pageSize + "-byte pages · " +
        snap.pageCount + " pages · " + free + " · next log sequence " + snap.nextLSN +
        " · log " + snap.walBytes + " bytes";
      tablesEl.replaceChildren();
      if (!snap.tables || snap.tables.length === 0) {
        const empty = document.createElement("p");
        empty.id = "note";
        empty.textContent = "This file has no tables.";
        tablesEl.append(empty);
      }
      for (const table of snap.tables || []) {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "table-button";
        button.innerHTML = "<strong>" + escapeHTML(table.name) + "</strong><span>" +
          escapeHTML(table.primaryKey) + " key</span>";
        if (table.name === selected) button.setAttribute("aria-current", "true");
        button.addEventListener("click", () => openTable(table.name));
        tablesEl.append(button);
      }
      pagesEl.replaceChildren();
      const current = (snap.tables || []).find((table) => table.name === selected);
      for (const page of snap.pages || []) {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "page-button";
        if (current && (page.id === current.header || page.id === current.index)) {
          button.classList.add("mark");
        }
        button.innerHTML = "<strong>" + page.id + "</strong><small>" + escapeHTML(page.kind) + "</small>";
        button.title = "Page " + page.id + ", " + page.kind + ", log sequence " + page.lsn;
        button.addEventListener("click", () => {
          const owner = (snap.tables || []).find((table) => table.header === page.id || table.index === page.id);
          if (owner) openTable(owner.name);
        });
        pagesEl.append(button);
      }
      if (snap.truncated) {
        const more = document.createElement("p");
        more.textContent = "Showing the first " + snap.pages.length + " pages.";
        pagesEl.append(more);
      }
    }

    async function loadSnap() {
      const res = await fetch("/api/inspect");
      if (!res.ok) throw new Error(await res.text());
      snap = await res.json();
      if (!snap.tables) snap.tables = [];
      if (selected && !snap.tables.some((table) => table.name === selected)) selected = "";
      if (!selected && snap.tables.length > 0 && !statementRows) selected = snap.tables[0].name;
      renderSnap();
    }

    async function openTable(name) {
      statementRows = false;
      selected = name;
      renderSnap();
      const res = await fetch("/api/rows?table=" + encodeURIComponent(name));
      const body = await res.json();
      if (!res.ok) {
        setStatus(body.error || "Could not read " + name, true);
        return;
      }
      setStatus("");
      const extra = body.rows.length === 200 ? "Showing the first 200 rows." : rowCount(body.rows.length);
      showRows(body.columns, body.rows, name, extra);
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const statement = sql.value.trim();
      if (!statement) return;
      run.disabled = true;
      setStatus("Running…", false);
      try {
        const res = await fetch("/api/exec", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ statement })
        });
        const body = await res.json();
        if (!res.ok) {
          setStatus(body.error || "The statement failed", true);
          return;
        }
        statementRows = Array.isArray(body.columns);
        await loadSnap();
        if (statementRows) {
          selected = "";
          renderSnap();
          showRows(body.columns, body.rows, "Statement result", rowCount(body.rows.length));
          setStatus("");
        } else {
          const changed = "changed " + body.changed;
          if (selected) await openTable(selected);
          else if (snap.tables.length > 0) await openTable(snap.tables[0].name);
          else showRows([], [], "Rows", "This file has no tables. Run CREATE TABLE to add one.");
          setStatus(changed, false);
        }
      } catch (err) {
        setStatus(String(err), true);
      } finally {
        run.disabled = false;
      }
    });

    loadSnap().then(() => {
      if (selected) return openTable(selected);
      showRows([], [], "Rows", "This file has no tables. Run CREATE TABLE to add one.");
    }).catch((err) => setStatus(String(err), true));
  </script>
</body>
</html>
